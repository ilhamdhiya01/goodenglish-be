name: CI

on:
  push:
  pull_request:
  # Lets docker-publish.yml call this workflow directly (`uses:
  # ./.github/workflows/ci.yml`) as its own gate, instead of duplicating
  # the same lint/typecheck/build steps in two files.
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          HUSKY: 0

      # Build-time only — reads schema.prisma, no live DB needed. Required
      # before lint/typecheck/build because many files import types
      # directly from src/generated/prisma.
      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build

  # The Python speech-to-text service (stt/): its tests run with the model
  # mocked, so no model download here.
  stt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: stt/requirements*.txt

      - name: Install
        run: pip install -r stt/requirements-dev.txt

      - name: Test
        working-directory: stt
        run: python -m pytest -q tests
