services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: goodenglish_db
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    # No host port mapping — only `migrate`/`app` reach Postgres, over the
    # Compose network. docker-compose.override.yml publishes it locally.

  # One-off job: runs `prisma migrate deploy` against `db`, then exits.
  # Kept out of the long-running `app` image — see the Dockerfile's
  # `migrator` stage comment (the prisma CLI alone is ~250MB of tooling).
  migrate:
    image: ghcr.io/${GHCR_OWNER}/goodenglish-be:${IMAGE_TAG:-latest}-migrator
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  app:
    # IMAGE_TAG defaults to `latest` (production, built from `main`). Never
    # hardcode `dev` here: this same file is the one copied to the VPS.
    image: ghcr.io/${GHCR_OWNER}/goodenglish-be:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      # The speech-to-text service below, over the Compose network.
      STT_URL: ${STT_URL:-http://stt:8000}
    ports:
      # Host side only, for nginx (goodenglish.my.id /api/v1 → 3201). The app
      # still listens on 3001 inside its container.
      - '127.0.0.1:${APP_PORT:-3201}:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3001/api/v1/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  # Speech-to-text for the Main peran mic (stt/): faster-whisper on CPU.
  # Internal only (no ports): just `app` calls it. The model is downloaded
  # into `stt_models` on first start (~0.5 GB for `small`) and loaded once.
  # Sized for the 2 vCPU / 4 GB VPS; see stt/README.md to change the model.
  stt:
    image: ghcr.io/${GHCR_OWNER}/goodenglish-stt:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      STT_MODEL: ${STT_MODEL:-small}
      STT_DEVICE: ${STT_DEVICE:-cpu}
      STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
      STT_CPU_THREADS: ${STT_CPU_THREADS:-2}
      STT_BEAM_SIZE: ${STT_BEAM_SIZE:-5}
      STT_CONCURRENCY: ${STT_CONCURRENCY:-1}
      STT_QUEUE_MAX: ${STT_QUEUE_MAX:-4}
      LOG_LEVEL: ${STT_LOG_LEVEL:-INFO}
    volumes:
      - stt_models:/models
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1536M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  db_data:
  stt_models:
