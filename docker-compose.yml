services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: goodenglish_db
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    # No host port mapping — only `migrate`/`app` reach Postgres, over the
    # Compose network. docker-compose.override.yml publishes it locally.

  # One-off job: runs `prisma migrate deploy` against `db`, then exits.
  # Kept out of the long-running `app` image — see the Dockerfile's
  # `migrator` stage comment (the prisma CLI alone is ~250MB of tooling).
  migrate:
    image: ghcr.io/${GHCR_OWNER}/goodenglish-be:${IMAGE_TAG:-latest}-migrator
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  app:
    # IMAGE_TAG defaults to `latest` (production, built from `main`). Never
    # hardcode `dev` here: this same file is the one copied to the VPS.
    image: ghcr.io/${GHCR_OWNER}/goodenglish-be:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    ports:
      # Host side only, for nginx (goodenglish.my.id /api/v1 → 3201). The app
      # still listens on 3001 inside its container.
      - '127.0.0.1:${APP_PORT:-3201}:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3001/api/v1/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  db_data:
